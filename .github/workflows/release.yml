name: release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "release/*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cli:
    name: check CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - run: go test ./...
        working-directory: rep
      - name: Build Windows x64 binary
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/flcl42/notify/rep/internal/version.Version=test" -o /tmp/rep-windows-x64.exe .
        working-directory: rep

  check-android:
    name: check Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x android/gradlew
      - run: ./android/gradlew -p android assembleDebug

  build-cli:
    name: build ${{ matrix.asset }}
    needs: check-cli
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: rep-linux-x64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset: rep-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: rep-windows-x64.exe
          - os: windows-latest
            goos: windows
            goarch: arm64
            asset: rep-windows-arm64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: rep-macos-x64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: rep-macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Determine version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"
          version="${version#v}"
          echo "REP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build standalone executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p rep/dist
          go build -C rep -ldflags "-X github.com/flcl42/notify/rep/internal/version.Version=$REP_VERSION" -o "rep/dist/${{ matrix.asset }}" .
      - name: Verify packaged executable
        shell: bash
        run: |
          binary="rep/dist/${{ matrix.asset }}"
          target_arch="${{ matrix.goarch }}"

          # Only run the binary when the host architecture matches.
          if [[ "$RUNNER_OS" == "macOS" && "$target_arch" == "arm64" ]]; then
            actual_version=$("./$binary" --version | awk '{print $3}')
            expected_version="$REP_VERSION"
            if [ "$actual_version" != "$expected_version" ]; then
              echo "Expected version $expected_version, got $actual_version"
              exit 1
            fi
          fi

          if [[ "$RUNNER_OS" == "Windows" && "$target_arch" == "amd64" ]]; then
            actual_version=$("./$binary" --version | awk '{print $3}')
            expected_version="$REP_VERSION"
            if [ "$actual_version" != "$expected_version" ]; then
              echo "Expected version $expected_version, got $actual_version"
              exit 1
            fi
          fi

          if [[ "$RUNNER_OS" == "Linux" && "$target_arch" == "amd64" ]]; then
            chmod +x "$binary"
            actual_version=$("./$binary" --version | awk '{print $3}')
            expected_version="$REP_VERSION"
            if [ "$actual_version" != "$expected_version" ]; then
              echo "Expected version $expected_VERSION, got $actual_version"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: rep/dist/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  build-android:
    name: build signed Android APK
    needs: check-android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x android/gradlew
      - name: Validate release tag and secrets
        shell: bash
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#release/}"
          version="${version#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Tag version $version does not match package.json version $package_version."
            exit 1
          fi

          missing=0
          declare -A secret_names=(
            [FIREBASE_CONFIG]=FIREBASE_GOOGLE_SERVICES_JSON_BASE64
            [SIGNING_KEYSTORE]=ANDROID_SIGNING_KEYSTORE_BASE64
            [SIGNING_STORE_PASSWORD]=ANDROID_SIGNING_STORE_PASSWORD
            [SIGNING_KEY_ALIAS]=ANDROID_SIGNING_KEY_ALIAS
            [SIGNING_KEY_PASSWORD]=ANDROID_SIGNING_KEY_PASSWORD
          )
          for name in "${!secret_names[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${secret_names[$name]}"
              missing=1
            fi
          done
          exit "$missing"
      - name: Materialize Android build credentials
        shell: bash
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" | base64 --decode > android/app/google-services.json
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/private-notify-release.jks"
      - name: Build signed release APK
        env:
          PRIVATE_NOTIFY_KEYSTORE_PATH: ${{ runner.temp }}/private-notify-release.jks
          PRIVATE_NOTIFY_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          PRIVATE_NOTIFY_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          PRIVATE_NOTIFY_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          PRIVATE_NOTIFY_VERSION_NAME: ${{ github.ref_name }}
          PRIVATE_NOTIFY_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          PRIVATE_NOTIFY_VERSION_NAME="${PRIVATE_NOTIFY_VERSION_NAME#release/}"
          PRIVATE_NOTIFY_VERSION_NAME="${PRIVATE_NOTIFY_VERSION_NAME#v}"
          export PRIVATE_NOTIFY_VERSION_NAME
          ./android/gradlew -p android assembleRelease
      - name: Verify and stage APK
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/private-notify-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: private-notify-android.apk
          path: dist/private-notify-android.apk
          if-no-files-found: error
          compression-level: 0
      - name: Remove materialized credentials
        if: always()
        shell: bash
        run: rm -f android/app/google-services.json "$RUNNER_TEMP/private-notify-release.jks"

  release:
    name: publish release
    needs:
      - build-cli
      - build-android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Add installer and checksums
        shell: bash
        run: |
          cp install.ps1 release-assets/install.ps1
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#release/}"
          version="${version#v}"
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              "${prerelease[@]}"
          fi
